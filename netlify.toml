# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION & PWA RULES
# Portal Yiqul - Unified Digital Ecosystem Launcher
# ==============================================================================

[build]
  publish = "."

# SPA Redirect Rule (Menangani routing #/ dan #/portal tanpa 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Global Performance Headers (OWASP Hardening)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https: data: blob:; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; frame-src 'self' https:; font-src 'self' https: data:;"

# PWA Service Worker Specific Headers (Mencegah stale cache)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=UTF-8"

# Web App Manifest Header
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static Assets Caching (Fonts, Icons, CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
