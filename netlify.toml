# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION & PWA RULES
# Portal Yiqul - Unified Digital Ecosystem Launcher
# ==============================================================================

[build]
  publish = "."

# SPA Redirect Rule (Menangani routing #/ dan #/portal tanpa 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Global Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# PWA Service Worker Specific Headers (Mencegah stale cache)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=UTF-8"

# Web App Manifest Header
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static Assets Caching (Fonts, Icons, CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
